site_name: Apphive Docs
site_url: https://docs.apphive.io/
site_description: Documentación oficial de Apphive
docs_dir: docs
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  generator: false
  alternate:
    - name: Español
      link: /
      lang: es
    - name: English
      link: /en/
      lang: en

plugins:
  - search:
      lang:
        - es
        - en
  - redirects:
      redirect_maps:
        'apphive-documentacion.md': 'README.md'
        'apphive-documentacion/iniciar/crear-un-nuevo-proyecto.md': 'crear-un-nuevo-proyecto/README.md'
